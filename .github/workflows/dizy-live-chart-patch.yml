name: DIZY live chart patch

on:
  push:
    branches:
      - feature/dizy-live-chart

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizy-live-chart
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Patch DEX chart selection
        run: python3 scripts/patch-dizy-live-chart.py
      - name: Refine DEX status transition
        run: python3 -c 'from pathlib import Path; p=Path("app/trading-terminal.tsx"); s=p.read_text(); s=s.replace("    setRealtimeStatus(\"delayed\");\n    const timer = window.setInterval(", "    const timer = window.setInterval(", 1); s=s.replace("                    setSelectedDexMarket(market);\n                    setSymbol", "                    setSelectedDexMarket(market);\n                    setRealtimeStatus(\"delayed\");\n                    setSymbol", 1); p.write_text(s)'
      - run: npm ci
      - name: Focused DEX tests
        run: node --conditions=react-server --import tsx --test tests/dex.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "DizyTrades CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/market-browser.tsx app/trading-terminal.tsx tests/dex.test.mjs
          git commit -m "Wire DIZY Raydium candles into DizyCharts"
          git push origin HEAD:feature/dizy-live-chart
