name: PR 161 source snapshot

on:
  pull_request:
  push:
    branches:
      - agent/simulator-accounting-audit

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive audited source
        run: tar --exclude=.git --exclude=node_modules --exclude=artifacts -czf /tmp/dizytrades-pr161-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pr161-source-snapshot
          path: /tmp/dizytrades-pr161-source.tar.gz
          retention-days: 1
