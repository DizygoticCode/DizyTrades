name: PR 161 update status

on:
  push:
    branches:
      - agent/simulator-accounting-audit

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simulator-accounting-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update public status and remove temporary machinery
        run: |
          node scripts/pr161-update-status.mjs
          rm scripts/pr161-update-status.mjs
          rm .github/workflows/pr161-update-status.yml
          git config user.name "DizyTrades Audit"
          git config user.email "actions@users.noreply.github.com"
          git add ROADMAP.md README.md RELEASE_NOTES.md scripts/pr161-update-status.mjs .github/workflows/pr161-update-status.yml
          git commit -m "Mark simulator accounting audit complete"
          git push origin HEAD:agent/simulator-accounting-audit
