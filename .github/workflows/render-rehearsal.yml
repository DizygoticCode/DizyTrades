name: Render deployment rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/render-rehearsal.yml"
      - ".node-version"
      - "app/dizyflow-fixture/**"
      - "app/lib/chart/dizyflow-primitive.ts"
      - "app/lib/order-flow/**"
      - "app/login/login-form.tsx"
      - "app/trading-terminal.tsx"
      - "scripts/render-rehearsal.mjs"
      - "scripts/dizyflow-deployment-acceptance.mjs"
      - "scripts/dizyflow-depth-failure-diagnostic.mjs"
      - "tests/render-rehearsal.test.mjs"
      - "tests/dizyflow-deployment-acceptance.test.mjs"
      - "tests/dizyflow-depth-failure-diagnostic.test.mjs"
      - "tests/dizyflow-login-hydration.test.mjs"
      - "tests/dizyflow-projection-retention.test.mjs"
      - "tests/browser/dizyflow-render.spec.ts"
      - "tests/browser/dizyflow-terminal-lifecycle.spec.ts"
      - "docs/RENDER_REHEARSAL.md"
      - "docs/DIZYFLOW_HEATMAP_ACCEPTANCE.md"
      - "ROADMAP.md"
  push:
    branches:
      - main
      - agent/render-rehearsal
    paths:
      - ".github/workflows/render-rehearsal.yml"
      - ".node-version"
      - "app/dizyflow-fixture/**"
      - "app/lib/chart/dizyflow-primitive.ts"
      - "app/lib/order-flow/**"
      - "app/login/login-form.tsx"
      - "app/trading-terminal.tsx"
      - "scripts/render-rehearsal.mjs"
      - "scripts/dizyflow-deployment-acceptance.mjs"
      - "scripts/dizyflow-depth-failure-diagnostic.mjs"
      - "tests/render-rehearsal.test.mjs"
      - "tests/dizyflow-deployment-acceptance.test.mjs"
      - "tests/dizyflow-depth-failure-diagnostic.test.mjs"
      - "tests/dizyflow-login-hydration.test.mjs"
      - "tests/dizyflow-projection-retention.test.mjs"
      - "tests/browser/dizyflow-render.spec.ts"
      - "tests/browser/dizyflow-terminal-lifecycle.spec.ts"
      - "docs/RENDER_REHEARSAL.md"
      - "docs/DIZYFLOW_HEATMAP_ACCEPTANCE.md"
      - "ROADMAP.md"
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Optional Git commit that must become Render's live deploy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: render-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_WAIT_MINUTES: "20"
      REHEARSAL_OUTPUT_DIR: artifacts/render-rehearsal
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Verify rehearsal helpers
        run: node --test tests/render-rehearsal.test.mjs tests/dizyflow-deployment-acceptance.test.mjs tests/dizyflow-depth-failure-diagnostic.test.mjs tests/dizyflow-login-hydration.test.mjs

      - name: Record pull-request boundary
        if: github.event_name == 'pull_request'
        run: |
          echo "Pull-request runs validate the bounded observer helpers only."
          echo "Exact-commit Render observation runs after merge when the main push can become the live deploy."

      - name: Install Chromium for deployed acceptance
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Resolve expected deploy commit
        if: github.event_name != 'pull_request'
        env:
          DISPATCH_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "EXPECTED_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_EXPECTED_COMMIT" ]]; then
            echo "EXPECTED_COMMIT=$DISPATCH_EXPECTED_COMMIT" >> "$GITHUB_ENV"
          else
            echo "EXPECTED_COMMIT=" >> "$GITHUB_ENV"
          fi

      - name: Verify encrypted Render credentials are available
        if: github.event_name != 'pull_request'
        run: |
          if [[ -z "$RENDER_API_KEY" ]]; then
            echo "RENDER_API_KEY repository secret is unavailable." >&2
            exit 1
          fi
          if [[ -z "$RENDER_SERVICE_ID" ]]; then
            echo "RENDER_SERVICE_ID repository secret is unavailable." >&2
            exit 1
          fi

      - name: Observe Render service deploy and production health
        if: github.event_name != 'pull_request'
        run: node scripts/render-rehearsal.mjs

      - name: Exercise deployed DizyFlow presentation
        if: github.event_name != 'pull_request'
        run: node scripts/dizyflow-deployment-acceptance.mjs

      - name: Collect bounded depth failure diagnostic
        if: ${{ failure() && github.event_name != 'pull_request' }}
        run: node scripts/dizyflow-depth-failure-diagnostic.mjs

      - name: Upload sanitised rehearsal evidence
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: render-rehearsal-${{ github.run_id }}
          path: artifacts/render-rehearsal
          if-no-files-found: error
          retention-days: 30
