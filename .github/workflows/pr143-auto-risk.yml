name: Apply PR 143 visible-depth automatic risk exits

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/pr143/**"
      - ".github/workflows/pr143-auto-risk.yml"

permissions:
  contents: write

concurrency:
  group: pr143-auto-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.head_ref == 'feature/dizypaper-depth-auto-risk-exits'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-depth-auto-risk-exits
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply automatic risk depth patch
        run: node scripts/pr143/apply.mjs
      - name: Focused automatic risk tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-depth-auto-risk.test.mjs tests/manual-paper-depth-auto-risk-route.test.mjs tests/manual-paper-depth.test.mjs tests/manual-paper.test.mjs tests/manual-paper-backup.test.mjs
      - name: Full unit suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove temporary patch machinery
        run: rm -rf scripts/pr143 .github/workflows/pr143-auto-risk.yml
      - name: Commit validated implementation
        run: |
          git config user.name "DizygoticCode"
          git config user.email "232596562+DizygoticCode@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Add visible-depth automatic risk exits"
            git push origin HEAD:feature/dizypaper-depth-auto-risk-exits
          fi
