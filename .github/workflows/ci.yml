name: DizyTrades checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr164-command-palette-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 164 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Defer command actions until modal teardown
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/command-palette.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''  const run = useCallback(
    (command: CommandDefinition) => {
      const action = command.action;
      setOpen(false);
      setQuery("");
      setSelected(0);
      if (action.type === "navigate") {
        window.location.assign(action.href);
        return;
      }
      if (action.type === "reload") {
        window.location.reload();
        return;
      }
      if (action.type === "reference") {
        setMode("reference");
        setOpen(true);
        return;
      }
      if (pathname === "/terminal" && executeLauncher(action.launcher)) return;
      sessionStorage.setItem(pendingLauncherKey, action.launcher);
      window.location.assign("/terminal");
    },
    [pathname],
  );'''
          new = '''  const run = useCallback(
    (command: CommandDefinition) => {
      const action = command.action;
      if (action.type === "reference") {
        setMode("reference");
        setQuery("");
        setSelected(0);
        return;
      }
      setOpen(false);
      setQuery("");
      setSelected(0);
      window.requestAnimationFrame(() => {
        if (action.type === "navigate") {
          window.location.assign(action.href);
          return;
        }
        if (action.type === "reload") {
          window.location.reload();
          return;
        }
        if (pathname === "/terminal" && executeLauncher(action.launcher)) return;
        sessionStorage.setItem(pendingLauncherKey, action.launcher);
        window.location.assign("/terminal");
      });
    },
    [pathname],
  );'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one command run block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git checkout origin/main -- .github/workflows/ci.yml
      - name: Commit focused modal teardown fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/command-palette.tsx .github/workflows/ci.yml
          git commit -m "Wait for command palette teardown"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          SESSION_SECRET: dizytrades-e2e-session-secret-2026-at-least-32-characters
          PUBLIC_SIGNUP_ENABLED: "true"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7
