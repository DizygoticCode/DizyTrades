name: DizyTrades checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          SESSION_SECRET: dizytrades-e2e-session-secret-2026-at-least-32-characters
          PUBLIC_SIGNUP_ENABLED: "true"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

  one-time-lockfile-refresh:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/lockfile-audit-20260928' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/lockfile-audit-20260928
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Refresh the lockfile only, without running package scripts
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Require zero known audit findings
        run: npm audit --audit-level=low
      - name: Commit the npm-generated lockfile to this isolated branch
        run: |
          git add package-lock.json
          git diff --cached --quiet && { echo "No lockfile changes produced"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh lockfile for npm audit advisories"
          git push origin HEAD:refs/heads/chore/lockfile-audit-20260928
