name: DizyTrades checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr164-source-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 164 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace nested Manual Paper main with a named section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/manual-paper-ticket.tsx')
          text = path.read_text(encoding='utf-8')
          opening = '          <main className={styles.workspace}>'
          replacement = '          <section aria-label="Manual Paper account workspace" className={styles.workspace}>'
          if text.count(opening) != 1:
              raise SystemExit(f'Expected one Manual Paper workspace main, found {text.count(opening)}')
          start = text.index(opening)
          closing = '          </main>'
          end = text.index(closing, start)
          text = text[:start] + replacement + text[start + len(opening):end] + '          </section>' + text[end + len(closing):]
          path.write_text(text, encoding='utf-8')
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/pr164-source-fix.yml
      - name: Commit focused source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/manual-paper-ticket.tsx .github/workflows/ci.yml .github/workflows/pr164-source-fix.yml
          git commit -m "Fix Manual Paper landmark source"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          SESSION_SECRET: dizytrades-e2e-session-secret-2026-at-least-32-characters
          PUBLIC_SIGNUP_ENABLED: "true"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7
