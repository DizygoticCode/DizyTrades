name: DizyTrades checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Resolve patched Next.js lockfile on security branch only
        if: github.head_ref == 'security/node-22-23-4-audit' || github.ref == 'refs/heads/security/node-22-23-4-audit'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Publish generated security lockfile for review
        if: github.head_ref == 'security/node-22-23-4-audit' || github.ref == 'refs/heads/security/node-22-23-4-audit'
        uses: actions/upload-artifact@v7
        with:
          name: patched-next-lockfile
          path: package-lock.json
          retention-days: 7
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Resolve patched Next.js lockfile on security branch only
        if: github.head_ref == 'security/node-22-23-4-audit' || github.ref == 'refs/heads/security/node-22-23-4-audit'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          SESSION_SECRET: dizytrades-e2e-session-secret-2026-at-least-32-characters
          PUBLIC_SIGNUP_ENABLED: "true"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7
