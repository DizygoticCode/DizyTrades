name: DizyTrades checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Resolve patched Next.js lockfile on security branch only
        if: github.head_ref == 'security/node-22-23-4-audit' || github.ref == 'refs/heads/security/node-22-23-4-audit'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Publish generated security lockfile for review
        if: github.head_ref == 'security/node-22-23-4-audit' || github.ref == 'refs/heads/security/node-22-23-4-audit'
        uses: actions/upload-artifact@v7
        with:
          name: patched-next-lockfile
          path: package-lock.json
          retention-days: 7
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Resolve patched Next.js lockfile on security branch only
        if: github.head_ref == 'security/node-22-23-4-audit' || github.ref == 'refs/heads/security/node-22-23-4-audit'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          SESSION_SECRET: dizytrades-e2e-session-secret-2026-at-least-32-characters
          PUBLIC_SIGNUP_ENABLED: "true"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

  security-lockfile-refresh:
    if: github.event_name == 'push' && github.ref == 'refs/heads/security/node-22-23-4-audit' && github.event.head_commit.message != 'security(lock): persist patched Next dependencies'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve patched transitive dependency tree
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save deterministic lockfile to security branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No changes to package-lock.json'
          else
            git commit -m 'security(lock): persist patched Next dependencies'
            git push origin HEAD:security/node-22-23-4-audit
          fi
