name: Apply PR 139 review fixes

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/pr139-review/**"
      - ".github/workflows/pr139-review-fixes.yml"

permissions:
  contents: write

concurrency:
  group: pr139-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'feature/dizypaper-funding-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-funding-provenance
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply funding review corrections
        run: node scripts/pr139-review/apply.mjs
      - name: Focused funding accounting tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-funding.test.mjs tests/manual-paper-fees.test.mjs tests/manual-paper.test.mjs
      - name: Full unit suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove temporary review machinery
        run: rm -rf scripts/pr139-review .github/workflows/pr139-review-fixes.yml
      - name: Commit validated review corrections
        run: |
          git config user.name "DizyTrades Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden DizyPaper funding accounting"
          git push origin HEAD:feature/dizypaper-funding-provenance
