name: DIZY OHLCV direction proof

on:
  push:
    branches:
      - fix/dizy-ohlcv-token-direction

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - name: Focused DEX tests
        run: node --conditions=react-server --import tsx --test tests/dex.test.mjs
      - run: npm run lint
      - run: npm run build
