name: Apply PR 149 margin assumptions

on:
  push:
    branches:
      - feature/dizypaper-isolated-cross-margin-assumptions
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: apply-pr149-margin-assumptions
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-isolated-cross-margin-assumptions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply margin accounting patch
        run: |
          node scripts/pr149/01-margin-model.mjs
          node scripts/pr149/02a-manual-paper-boundary.mjs
          node scripts/pr149/02b-manual-paper-lifecycle.mjs
          node scripts/pr149/03-backup.mjs
          node scripts/pr149/04-ui-roadmap.mjs
          node scripts/pr149/05-tests.mjs
      - name: Focused isolated and cross margin tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-margin-model.test.mjs tests/manual-paper-margin-lifecycle.test.mjs tests/manual-paper-margin-source.test.mjs tests/manual-paper-risk-tiers.test.mjs tests/manual-paper-reduce-only.test.mjs tests/manual-paper-depth-auto-risk.test.mjs tests/manual-paper-engine.test.mjs
      - name: Full unit suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove temporary patch machinery
        run: rm -rf scripts/pr149 .github/workflows/apply-pr149-margin-assumptions.yml
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated product changes were produced."
            exit 1
          fi
          git commit -m "Clarify isolated and cross margin accounting"
          git push origin HEAD:feature/dizypaper-isolated-cross-margin-assumptions
