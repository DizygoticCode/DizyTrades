name: Temporary Next security build validation

on:
  push:
    branches:
      - agent/next-security-16-2-12

permissions:
  contents: read

jobs:
  validate-next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/next-security-16-2-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
