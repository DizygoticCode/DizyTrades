name: One-time Next.js 16.4.1 lockfile refresh (draft security branch)
on:
  push:
    branches:
      - security/node-22-23-4-audit
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message != 'chore(security): refresh Next 16.4.1 lockfile'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Refresh Next.js and compatible transitive security fixes without running install scripts
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund next@16.4.1 eslint-config-next@16.4.1
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit refreshed manifest and lockfile, remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-next-security-lock.yml
          git add package.json package-lock.json
          git diff --cached --stat
          git commit -m 'chore(security): refresh Next 16.4.1 lockfile'
          git push
