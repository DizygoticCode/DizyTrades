name: Apply PR 137 fee provenance

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/pr137/**"
      - ".github/workflows/pr137-fee-provenance.yml"

permissions:
  contents: write

concurrency:
  group: pr137-fee-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'feature/dizypaper-fee-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-fee-provenance
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact source patch
        run: node scripts/pr137/apply.mjs
      - name: Focused fee provenance tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-fees.test.mjs tests/manual-paper.test.mjs tests/mexc-contract-metadata.test.mjs
      - name: Full unit suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove temporary patch machinery
        run: rm -rf scripts/pr137 .github/workflows/pr137-fee-provenance.yml
      - name: Commit validated implementation
        run: |
          git config user.name "DizyTrades Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add DizyPaper fee provenance"
          git push origin HEAD:feature/dizypaper-fee-provenance
