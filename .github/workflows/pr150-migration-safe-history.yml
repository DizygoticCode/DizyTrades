name: Build PR 150 migration-safe history

on:
  push:
    branches:
      - feature/dizypaper-migration-safe-history-backups
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: pr150-migration-safe-history
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-migration-safe-history-backups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply versioned migration implementation
        run: |
          node scripts/pr150/01-history-module.mjs
          node scripts/pr150/02-manual-paper.mjs
          node scripts/pr150/03-manual-backup.mjs
          node scripts/pr150/04-user-backup-model.mjs
          node scripts/pr150/05-user-backup-store.mjs
          node scripts/pr150/06-ui-roadmap-tests.mjs
          node scripts/pr150/07-strict-current-schema.mjs
          node scripts/pr150/08-migration-regressions.mjs
          node scripts/pr150/09-fill-creation-provenance.mjs
          node scripts/pr150/10-final-compatibility.mjs
      - name: Focused migration and Paper evidence tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-history.test.mjs tests/user-backup-migration.test.mjs tests/user-backup.test.mjs tests/manual-paper-funding.test.mjs tests/manual-paper-margin-lifecycle.test.mjs tests/manual-paper-risk-tiers.test.mjs tests/manual-paper-reduce-only.test.mjs tests/manual-paper-depth-auto-risk.test.mjs
      - name: Full unit suite
        shell: bash
        run: |
          set +e
          npm test > /tmp/pr150-full-suite.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== PR 150 COMPACT FAILURE REPORT ====="
            node <<'NODE'
          const fs=require('node:fs');
          const lines=fs.readFileSync('/tmp/pr150-full-suite.log','utf8').split(/\r?\n/);
          const starts=[];
          for(let i=0;i<lines.length;i++)if(/^not ok\s+\d+\s+-\s+/.test(lines[i])||/^# Subtest:/.test(lines[i])&&/^not ok\s+\d+\s+-\s+/.test(lines[i+1]||''))starts.push(i);
          if(!starts.length){console.log(lines.filter(line=>/not ok|ERR_|AssertionError|Error:|failureType:|location:/.test(line)).slice(-300).join('\n'))}else{for(const start of starts){let end=Math.min(lines.length,start+80);for(let i=start+1;i<Math.min(lines.length,start+80);i++)if(/^# Subtest:/.test(lines[i])||/^ok\s+\d+\s+-\s+/.test(lines[i])||/^not ok\s+\d+\s+-\s+/.test(lines[i])){end=i;break}console.log(lines.slice(start,end).join('\n'));console.log('---')}}
          NODE
            echo "===== END COMPACT FAILURE REPORT ====="
            exit "$status"
          fi
          cat /tmp/pr150-full-suite.log
      - name: Lint
        run: npm run lint
      - name: TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/pr150-tsc.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== PR 150 TYPESCRIPT DIAGNOSTICS ====="
            cat /tmp/pr150-tsc.log
            echo "===== END TYPESCRIPT DIAGNOSTICS ====="
            exit "$status"
          fi
          cat /tmp/pr150-tsc.log
      - name: Production build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/pr150-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== PR 150 BUILD FAILURE ====="
            grep -E 'Type error:|error TS|Failed to compile|^[.]/.*:[0-9]+:[0-9]+' /tmp/pr150-build.log || true
            tail -n 180 /tmp/pr150-build.log
            echo "===== END BUILD FAILURE ====="
            exit "$status"
          fi
          cat /tmp/pr150-build.log
      - name: Remove temporary migration machinery
        run: rm -rf scripts/pr150 .github/workflows/pr150-migration-safe-history.yml
      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes were produced."
            exit 1
          fi
          git commit -m "Add migration-safe DizyPaper history and backups"
          git push origin HEAD:feature/dizypaper-migration-safe-history-backups
