name: PR 161 apply accounting audit

on:
  push:
    branches:
      - agent/simulator-accounting-audit

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'temporary PR 161 accounting patch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simulator-accounting-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply accounting integration and remove temporary machinery
        run: |
          node scripts/pr161-apply-accounting.mjs
          rm scripts/pr161-apply-accounting.mjs
          rm .github/workflows/pr161-apply-accounting.yml
          git config user.name "DizyTrades Audit"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/manual-paper.ts app/lib/manual-paper-backup.ts scripts/pr161-apply-accounting.mjs .github/workflows/pr161-apply-accounting.yml
          git commit -m "Integrate Manual Paper accounting reconciliation"
          git push origin HEAD:agent/simulator-accounting-audit
