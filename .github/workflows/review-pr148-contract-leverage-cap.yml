name: Review PR 148 contract leverage cap

on:
  push:
    branches:
      - feature/dizypaper-maintenance-tiers-bankruptcy-audit

concurrency:
  group: review-pr148-contract-leverage-cap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-maintenance-tiers-bankruptcy-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reviewed leverage-cap fix
        run: node scripts/pr148-review/01-contract-leverage-cap.mjs
      - name: Focused tier and backup tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-risk-tiers.test.mjs tests/manual-paper-risk-tier-source.test.mjs tests/manual-paper-engine.test.mjs tests/mexc-contract-metadata.test.mjs
      - name: Full unit suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove temporary review machinery
        run: rm -rf scripts/pr148-review .github/workflows/review-pr148-contract-leverage-cap.yml
      - name: Commit reviewed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reviewed product changes were produced."
            exit 1
          fi
          git commit -m "Preserve contract leverage caps across risk tiers"
          git push origin HEAD:feature/dizypaper-maintenance-tiers-bankruptcy-audit
