name: Apply PR 134 DizyPaper Fidelity

on:
  push:
    branches:
      - feature/dizypaper-symbol-contract-fidelity
    paths:
      - scripts/pr134/**
      - .github/workflows/apply-pr134-dizypaper-fidelity.yml

permissions:
  contents: write

concurrency:
  group: apply-pr134-dizypaper-fidelity
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded source edits
        run: |
          node scripts/pr134/metadata.mjs
          node scripts/pr134/server.mjs
          node scripts/pr134/ui.mjs
          node scripts/pr134/tests.mjs

      - name: Run focused DizyPaper tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-engine.test.mjs tests/manual-paper.test.mjs tests/mexc-contract-metadata.test.mjs

      - name: Run full test suite
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Remove temporary patch machinery
        run: rm -rf scripts/pr134 .github/workflows/apply-pr134-dizypaper-fidelity.yml

      - name: Commit validated implementation
        run: |
          git config user.name "DizyTrades Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add symbol-aware MEXC leverage fidelity"
          git push origin HEAD:feature/dizypaper-symbol-contract-fidelity
