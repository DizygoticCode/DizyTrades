name: DIZY page build proof

on:
  pull_request:
    branches: [main]
    paths:
      - "app/dizy/**"
      - "app/lib/product-navigation.ts"
      - "app/marketing/site-header.tsx"
      - ".github/workflows/dizy-page-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
