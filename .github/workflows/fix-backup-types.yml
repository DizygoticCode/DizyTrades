name: Repair backup types

on:
  push:
    branches:
      - feature/backup-export-recovery
    paths:
      - .github/workflows/fix-backup-types.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/backup-export-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact enum and lint repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          backup = Path('app/lib/manual-paper-backup.ts')
          text = backup.read_text()
          old = text
          text = text.replace('["fair", "last", "preserved"] as const', '["fair", "last"] as const')
          text = text.replace('["manual", "stop-loss", "take-profit", "liquidation", "reversal"] as const', '["manual", "stop", "target", "liquidation", "reversal"] as const')
          if text == old:
              raise SystemExit('Expected backup enum patterns were not found')
          backup.write_text(text)

          store = Path('app/lib/user-backup-store.ts')
          store_text = store.read_text()
          store_new = store_text.replace(', type ManualAccount', '')
          store_new = store_new.replace('type ManualAccount,\n', '')
          if store_new == store_text:
              raise SystemExit('Expected unused ManualAccount import was not found')
          store.write_text(store_new)
          PY
          rm .github/workflows/fix-backup-types.yml
          git config user.name "DizyTrades CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/manual-paper-backup.ts app/lib/user-backup-store.ts .github/workflows/fix-backup-types.yml
          git commit -m "Fix backup parser type boundaries"
          git push origin HEAD:feature/backup-export-recovery
