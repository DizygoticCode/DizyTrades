name: Guarded execution docs sync temp

on:
  push:
    branches:
      - docs/guarded-execution-status-sync
    paths:
      - .github/workflows/docs-sync-temp.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/guarded-execution-status-sync
          fetch-depth: 0
      - name: Synchronize guarded execution documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "ROADMAP.md",
              "This roadmap reflects merged `main` as of **11 August 2026**.",
              "This roadmap reflects merged `main` as of **15 August 2026**.",
          )

          roadmap_marker = "Live execution remains disabled until every relevant requirement below is implemented, exercised and independently reviewed:\n"
          roadmap_checkpoint = """### 15 August 2026 checkpoint — production composition remains inert, writer authority hardened\n\nThe guarded-execution path has advanced through two additional reviewed milestones without enabling exchange submission:\n\n- [x] #320 added an **activation-disabled production write-composition seam** while hard-wiring the production factory to `ProductionMexcWriteComposition(null)`. Production constructs no `ModernMexcReduceOnlyWriter`, reads no execution credential and exposes no reachable MEXC POST path. The read-only Radar credential family remains independently validated and separated from any future write family.\n- [x] #322 eliminated the writer queue-to-sign stale-authority race. A queued new request obtains fresh server-owned credentials/authority only after the serialized/rate-limit wait, rechecks SQLite-backed quarantine, claims durable `reserved -> submitting`, then performs a second/final synchronous authority read after the potentially blocking claim before signing/POST.\n- [x] If post-claim authority disappears before transport, the exact `submitting/attempt=1/no-order-id` state is atomically released to `reserved/attempt=0`; known non-delivery is never mislabeled as an ambiguous submission.\n- [x] Potentially delivered lifecycle states remain GET-reconcilable by `externalOid` even after activation shutdown, kill-switch activation, quarantine or credential-generation rotation, without authorizing a second POST.\n- [x] Exact-head CI for #322 passed lint, the complete deterministic suite, production build and Chromium/Playwright; its actionable P2 was resolved and a fresh exact-head P1/P2 review found no remaining actionable P1/P2.\n- [ ] Verify stable Render -> MEXC egress allowlisting before provisioning a real write-capable credential.\n- [ ] Provision a dedicated, server-only, IP-restricted MEXC write credential only in a separately approved operator ceremony.\n- [ ] Independently review and deliberately connect the production composition to the writer while repository/deployment activation defaults remain false.\n- [ ] Perform a separately approved microscopic reduce-only canary only after every activation gate passes.\n\n""" + roadmap_marker
          replace_once("ROADMAP.md", roadmap_marker, roadmap_checkpoint)

          replace_once(
              "ROADMAP.md",
              "- [ ] Approve production exchange-write activation. A disabled, unrouted writer\n  seam exists in source, but provider submission remains unapproved and no\n  production composition can call it.",
              "- [ ] Approve production exchange-write activation. An activation-disabled\n  production composition seam now exists, but its production factory remains\n  hard-wired to null writer dependencies. No real execution credential read,\n  writer construction or production MEXC POST path is reachable.",
          )

          replace_once(
              "ROADMAP.md",
              "- [ ] Production exchange-write activation remains explicitly unapproved and\n  absent; the #315 writer seam is disabled and unrouted.",
              "- [ ] Production exchange-write activation remains explicitly unapproved.\n  #320 added only an inert composition boundary and #322 hardened the dormant\n  writer's last-pre-transport authority/recovery ordering; production still\n  constructs no writer and can reach no exchange POST.",
          )

          replace_once(
              "ROADMAP.md",
              "- [ ] Complete independent P1/P2 review, stable Render-egress allowlisting,\n  dedicated write-key provisioning, and a separate activation ceremony.",
              "- [x] Complete the queued/pre-transport authority hardening and exact-head\n  P1/P2 review required before the dormant writer can ever be considered for\n  production composition (#322).\n- [ ] Complete stable Render-egress allowlisting, dedicated write-key provisioning,\n  a separate production-writer composition review, and the activation ceremony.",
          )

          replace_once(
              "SECURITY.md",
              "- A server-only MEXC write seam exists in source but is production-disabled and unrouted; no active or public order-placement route exists.",
              "- A server-only MEXC write seam exists in source, but production remains non-writing. #320 added an activation-disabled composition seam whose production factory is hard-wired to null writer dependencies; it constructs no writer, reads no execution credential and exposes no reachable production MEXC POST path.\n- The dormant writer itself is hardened against queue/rate-limit and SQLite-claim authority races: new submissions require fresh server-owned authority/credentials after the wait and a second/final synchronous authority read after the durable claim, with known non-delivery released safely if that final check fails.\n- Potentially delivered lifecycle states remain GET-reconcilable by `externalOid` after shutdown, kill-switch activation, quarantine or credential-generation rotation without authorizing another POST; no active or public order-placement route exists.",
          )

          security_marker = "Never commit passwords, session secrets, API keys, Gmail App Passwords, `.env` files or exported account backups.\n"
          security_block = """## Activation-disabled production write composition\n\n`createProductionMexcWriteComposition()` is an explicit security-review boundary, not an active exchange adapter. Production currently returns `ProductionMexcWriteComposition(null)`: it does not construct `ModernMexcReduceOnlyWriter`, does not call `readMexcExecutionCredentials`, does not instantiate the write fetch transport and cannot invoke `writer.execute`. The synthetic candidate handoff receives only immutable intent plus bounded pre-write evidence and cannot receive credentials, environment, transport or `fetch`.\n\nThe dormant writer accepts immutable intent plus a synchronous server-owned pre-transport context provider rather than frozen mutable snapshots. For a never-attempted request it validates lifecycle identity/reservation, waits for its serialized rate-limit slot, obtains fresh write credentials/environment/evidence, validates the complete server-only/separate credential contract and mutable authority, checks exact-account quarantine, and performs the durable claim. Because the SQLite claim can itself block, the writer then checks quarantine and obtains a **second/final** fresh context before body construction/signing/POST. There is no asynchronous wait or database call between that final mutable context and transport initiation.\n\nIf authority disappears after claim but before transport, `releaseClaim()` can only roll the exact known-non-delivery `submitting`, `attempt=1`, `order_id IS NULL` row back to `reserved`, `attempt=0`; it cannot roll back submitted, indeterminate, reconciled or otherwise delivered evidence. Conversely, any lifecycle state that may already have been delivered is reconciled by the approved GET-by-`externalOid` path before any new-write authorization is considered. Recovery therefore remains possible after activation is disabled, a kill switch fires, the account is quarantined or credential generation rotates, while POST count remains unchanged.\n\nAll repository/deployment activation, custody and provisioning defaults remain false. No real MEXC write credential has been provisioned by these milestones, no browser/public execution route exists and no real exchange order has been sent. Stable Render egress allowlisting, dedicated write-key provisioning, explicit production writer composition, independent activation approval and the first canary remain separate future gates.\n\n""" + security_marker
          replace_once("SECURITY.md", security_marker, security_block)

          architecture_marker = "# Modern MEXC reduce-only writer seam\n"
          architecture_composition = """# Activation-disabled production write composition\n\nThe production write-composition seam is deliberately present but inert. `createProductionMexcWriteComposition()` returns `ProductionMexcWriteComposition(null)` in production: it constructs no `ModernMexcReduceOnlyWriter`, reads no execution credential, creates no write fetch transport and has no reachable MEXC POST path. Its bounded synthetic candidate handoff accepts only immutable execution intent plus `MexcPreWriteEvidence`; credentials, environment, transport and `fetch` cannot cross that boundary. This lets production compose and audit candidate authority without making a writer reachable.\n\nThe read-only Radar credential family remains separately validated. Any future writer connection must use a distinct server-only write credential generation and must arrive in a separate owner/security-approved change after stable egress allowlisting. Repository/deployment activation, custody and provisioning defaults remain false.\n\n""" + architecture_marker
          replace_once("ARCHITECTURE.md", architecture_marker, architecture_composition)

          old_ordering = """The invocation carries only immutable intent plus a synchronous, server-owned\npre-transport context provider. The writer validates lifecycle identity, performs\nrecovery inspection/reservation, and waits for its serialized rate-limit slot\nbefore calling that provider. It then validates the freshly read activation\nflags, credentials and credential generation, caller assurance, kill switches,\nownership/binding freshness, reconciliation, risk and rollout revisions,\negress attestation and quarantine. Only after those checks does it atomically\nclaim `reserved -> submitting`; signing and initiation of the single POST follow\nwithout an intervening asynchronous wait. A request that loses authority while\nqueued therefore remains a known, unclaimed reservation rather than a falsely\nambiguous delivery.\n"""
          new_ordering = """The invocation carries only immutable intent plus a synchronous, server-owned\npre-transport context provider. The writer validates lifecycle identity first. A\nlifecycle state that may already have reached MEXC is reconciled immediately by\nthe approved GET-by-`externalOid` path, even if write activation has since been\ndisabled, a kill switch has fired, the account is quarantined or credential\ngeneration has rotated; recovery does not authorize a second POST.\n\nFor a never-attempted reservation, the writer waits for its serialized rate-limit\nslot before calling the context provider. It validates the freshly read activation\nflags, the complete server-only/separate credential contract and credential\ngeneration, caller assurance, kill switches, ownership/binding freshness,\nreconciliation, risk and rollout revisions and egress attestation, then checks\nexact-account quarantine and atomically claims `reserved -> submitting`. Because\nthe SQLite claim can itself block, quarantine is checked again and the writer\nperforms a **second/final synchronous context read** after the claim. That final\nread is the last mutable authority observation before canonical-body construction,\nsigning and initiation of the single POST; no asynchronous wait or database read\nintervenes.\n\nIf that post-claim authority check fails, `releaseClaim()` can only move the exact\nknown-non-delivery `submitting`, `attempt=1`, no-order-id row back to\n`reserved`, `attempt=0`. Submitted, indeterminate, reconciled and other potentially\ndelivered states cannot use that rollback. A request that loses authority while\nqueued or while `claim()` is blocked therefore produces zero POSTs and remains\nknown/retryable rather than being mislabeled as an ambiguous delivery.\n"""
          replace_once("ARCHITECTURE.md", old_ordering, new_ordering)
          PY

          git config user.name "DizygoticCode"
          git config user.email "rob.noyce@gmail.com"
          git add ROADMAP.md SECURITY.md ARCHITECTURE.md
          git rm .github/workflows/docs-sync-temp.yml
          git commit -m "Sync guarded execution docs through #322"
          git push origin HEAD:docs/guarded-execution-status-sync
