name: Temporary homepage WebP migration

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-homepage-webp.yml"
      - "tests/temporary-tree-sha.test.mjs"

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/homepage-high-res-webp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-high-res-webp
          fetch-depth: 0
      - name: Install deterministic SVG and WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin webp
      - name: Render native lossless high-resolution WebP assets
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          render() {
            source="$1"
            target="$2"
            width="$3"
            rsvg-convert --width "$width" "$source" > "$work/$(basename "$target").png"
            cwebp -quiet -lossless -z 9 -metadata none "$work/$(basename "$target").png" -o "$target"
          }
          render public/marketing/hero-terminal.svg public/marketing/hero-terminal.webp 3840
          render public/marketing/feature-signals.svg public/marketing/feature-signals.webp 2276
          render public/marketing/feature-flow.svg public/marketing/feature-flow.webp 2636
          render public/marketing/feature-dom.svg public/marketing/feature-dom.webp 736
          render public/marketing/feature-paper.svg public/marketing/feature-paper.webp 2042
          render public/marketing/feature-learning.svg public/marketing/feature-learning.webp 1460
          rm -rf "$work"
      - name: Switch homepage references and add binary contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          terminal = Path("app/marketing/terminal-preview.tsx")
          terminal.write_text(
              terminal.read_text().replace('/marketing/hero-terminal.svg', '/marketing/hero-terminal.webp')
          )

          css = Path("app/marketing/real-feature-visuals.css")
          text = css.read_text()
          for name in (
              "feature-signals",
              "feature-flow",
              "feature-dom",
              "feature-paper",
              "feature-learning",
          ):
              text = text.replace(f"/marketing/{name}.svg", f"/marketing/{name}.webp")
          css.write_text(text)
          PY
          cat > tests/marketing-webp-assets.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const assets = [
            ["hero-terminal.webp", 3840, 1940],
            ["feature-signals.webp", 2276, 300],
            ["feature-flow.webp", 2636, 284],
            ["feature-dom.webp", 736, 1772],
            ["feature-paper.webp", 2042, 628],
            ["feature-learning.webp", 1460, 1906],
          ];

          function dimensions(buffer) {
            assert.equal(buffer.subarray(0, 4).toString("ascii"), "RIFF");
            assert.equal(buffer.subarray(8, 12).toString("ascii"), "WEBP");
            const chunk = buffer.subarray(12, 16).toString("ascii");
            if (chunk === "VP8X") {
              const width = 1 + buffer.readUIntLE(24, 3);
              const height = 1 + buffer.readUIntLE(27, 3);
              return [width, height];
            }
            if (chunk === "VP8L") {
              assert.equal(buffer[20], 0x2f);
              const bits = buffer.readUInt32LE(21);
              return [1 + (bits & 0x3fff), 1 + ((bits >> 14) & 0x3fff)];
            }
            if (chunk === "VP8 ") {
              assert.deepEqual([...buffer.subarray(23, 26)], [0x9d, 0x01, 0x2a]);
              return [buffer.readUInt16LE(26) & 0x3fff, buffer.readUInt16LE(28) & 0x3fff];
            }
            throw new Error(`Unsupported WebP chunk ${chunk}`);
          }

          test("homepage screenshots are native high-resolution WebP binaries", async () => {
            for (const [name, width, height] of assets) {
              const file = await readFile(new URL(`../public/marketing/${name}`, import.meta.url));
              assert.deepEqual(dimensions(file), [width, height], name);
            }
          });

          test("homepage screenshot references no longer use raster-style SVG payloads", async () => {
            const terminal = await readFile(new URL("../app/marketing/terminal-preview.tsx", import.meta.url), "utf8");
            const features = await readFile(new URL("../app/marketing/real-feature-visuals.css", import.meta.url), "utf8");
            assert.match(terminal, /hero-terminal\.webp/);
            for (const name of assets.slice(1).map(([name]) => name)) assert.match(features, new RegExp(name.replace(".", "\\.")));
            assert.doesNotMatch(`${terminal}\n${features}`, /(?:hero-terminal|feature-(?:signals|flow|dom|paper|learning))\.svg/);
          });
          EOF
      - name: Remove replaced SVG payloads and temporary migration machinery
        run: |
          rm public/marketing/hero-terminal.svg
          rm public/marketing/feature-signals.svg
          rm public/marketing/feature-flow.svg
          rm public/marketing/feature-dom.svg
          rm public/marketing/feature-paper.svg
          rm public/marketing/feature-learning.svg
          rm tests/temporary-tree-sha.test.mjs
          rm .github/workflows/temporary-homepage-webp.yml
      - name: Verify native files
        run: |
          node --test tests/marketing-webp-assets.test.mjs
          for file in public/marketing/*.webp; do webpinfo -summary "$file" >/dev/null; done
          git diff --check
      - name: Commit product-only head
        run: |
          git config user.name "DizyTrades migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace homepage screenshots with high-resolution WebP"
          git push origin HEAD:agent/homepage-high-res-webp
