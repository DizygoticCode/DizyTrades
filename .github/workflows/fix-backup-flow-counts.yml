name: Repair backup flow counts

on:
  push:
    branches:
      - feature/backup-export-recovery
    paths:
      - .github/workflows/fix-backup-flow-counts.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/backup-export-recovery
      - name: Apply unavailable-count type repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/lib/manual-paper-backup.ts')
          text = path.read_text()
          old = '''      sampleCount: null,
      eventCount: null,'''
          new = '''      sampleCount: 0,
      eventCount: 0,'''
          if old not in text:
              raise SystemExit('Expected unavailable flow count block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-backup-flow-counts.yml
          git config user.name "DizyTrades CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/manual-paper-backup.ts .github/workflows/fix-backup-flow-counts.yml
          git commit -m "Fix unavailable flow backup counts"
          git push origin HEAD:feature/backup-export-recovery
