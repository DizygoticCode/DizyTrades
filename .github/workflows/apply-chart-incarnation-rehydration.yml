name: Apply chart incarnation rehydration patch

on:
  push:
    branches:
      - agent/rehydrate-dizyflow-chart-incarnation
    paths:
      - ".github/workflows/apply-chart-incarnation-rehydration.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rehydrate-dizyflow-chart-incarnation
          fetch-depth: 0

      - name: Apply source and regression-test patch
        run: |
          python - <<'PY'
          from pathlib import Path

          sync = Path("app/lib/chart/series-sync.ts")
          source = sync.read_text()
          marker = '''export type TimedPoint = { time: number };\n'''
          addition = '''export type TimedPoint = { time: number };\n\nexport const chartSeriesSyncKey = (\n  symbol: string,\n  timeframe: string,\n  incarnation: number,\n) => `${incarnation}:${symbol}:${timeframe}`;\n'''
          if marker not in source:
              raise SystemExit("series-sync insertion marker missing")
          sync.write_text(source.replace(marker, addition, 1))

          terminal = Path("app/trading-terminal.tsx")
          source = terminal.read_text()
          old_import = '''import { planSeriesSync } from "./lib/chart/series-sync";'''
          new_import = '''import { chartSeriesSyncKey, planSeriesSync } from "./lib/chart/series-sync";'''
          if old_import not in source:
              raise SystemExit("series-sync import marker missing")
          source = source.replace(old_import, new_import, 1)

          state_marker = '''  const [chartError, setChartError] = useState<Error | null>(null);\n'''
          state_replacement = '''  const [chartError, setChartError] = useState<Error | null>(null);\n  const [chartIncarnation, setChartIncarnation] = useState(0);\n'''
          if state_marker not in source:
              raise SystemExit("chart state marker missing")
          source = source.replace(state_marker, state_replacement, 1)

          refs_marker = '''    chartRef.current = chart;\n    candleRef.current = candles;\n    volumeRef.current = volume;\n'''
          refs_replacement = '''    chartRef.current = chart;\n    candleRef.current = candles;\n    volumeRef.current = volume;\n    setChartIncarnation((value) => value + 1);\n'''
          if refs_marker not in source:
              raise SystemExit("chart refs marker missing")
          source = source.replace(refs_marker, refs_replacement, 1)

          key_marker = '''      key = `${symbol}:${timeframe}`,\n'''
          key_replacement = '''      key = chartSeriesSyncKey(symbol, timeframe, chartIncarnation),\n'''
          if key_marker not in source:
              raise SystemExit("series identity marker missing")
          source = source.replace(key_marker, key_replacement, 1)

          deps_marker = '''  }, [displayCandles, symbol, timeframe, view.appearance, redraw]);\n'''
          deps_replacement = '''  }, [\n    displayCandles,\n    symbol,\n    timeframe,\n    view.appearance,\n    redraw,\n    chartIncarnation,\n  ]);\n'''
          if deps_marker not in source:
              raise SystemExit("series effect dependency marker missing")
          source = source.replace(deps_marker, deps_replacement, 1)
          terminal.write_text(source)

          test = Path("tests/chart-incarnation-rehydration.test.mjs")
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\n\nimport {\n  chartSeriesSyncKey,\n  planSeriesSync,\n} from "../app/lib/chart/series-sync.ts";\n\nconst candles = [\n  { time: 1_700_000_000, close: 100 },\n  { time: 1_700_000_900, close: 101 },\n];\n\ntest("a new chart incarnation forces identical candles into the replacement series", () => {\n  const previousKey = chartSeriesSyncKey("BTC_USDT", "15m", 4);\n  const replacementKey = chartSeriesSyncKey("BTC_USDT", "15m", 5);\n  const plan = planSeriesSync(\n    candles,\n    candles,\n    previousKey !== replacementKey,\n  );\n\n  assert.notEqual(previousKey, replacementKey);\n  assert.equal(plan.operation, "setData");\n  assert.deepEqual(plan.data, candles);\n});\n\ntest("the same chart incarnation preserves the no-op path for unchanged candles", () => {\n  const currentKey = chartSeriesSyncKey("ETH_USDT", "1h", 2);\n  const plan = planSeriesSync(candles, candles, currentKey !== currentKey);\n  assert.equal(plan.operation, "none");\n});\n''')

          Path(".github/workflows/apply-chart-incarnation-rehydration.yml").unlink()
          PY

      - name: Commit the surgical patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rehydrate chart series on incarnation change"
          git push origin HEAD:agent/rehydrate-dizyflow-chart-incarnation
