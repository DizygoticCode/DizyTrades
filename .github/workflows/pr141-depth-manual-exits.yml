name: Diagnose PR 141 remaining lint

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/pr141/**"
      - ".github/workflows/pr141-depth-manual-exits.yml"

permissions:
  contents: read

concurrency:
  group: pr141-depth-manual-exits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-lint:
    if: github.event.pull_request.head.ref == 'feature/dizypaper-depth-manual-exits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-depth-manual-exits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Apply visible-depth manual exit patch
        run: node scripts/pr141/apply.mjs
      - name: Print lint errors only
        run: |
          set +e
          npx eslint app/lib/manual-paper.ts app/lib/manual-paper-backup.ts app/lib/manual-paper-depth.ts app/api/manual-paper/route.ts app/manual-paper-ticket.tsx tests/manual-paper-depth-exits.test.mjs tests/manual-paper-depth-exit-route.test.mjs --format json > /tmp/pr141-lint.json
          status=$?
          node - <<'NODE'
          const fs=require('fs');
          const files=JSON.parse(fs.readFileSync('/tmp/pr141-lint.json','utf8'));
          const errors=[];
          for(const file of files) for(const m of file.messages) if(m.severity===2) errors.push(`${file.filePath}:${m.line}:${m.column} ${m.ruleId??'parse'} ${m.message}`);
          console.log(errors.slice(0,20).join('\n') || 'NO_LINT_ERRORS');
          NODE
          exit "$status"
