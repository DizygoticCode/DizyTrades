name: Temporary Next lockfile generator

on:
  push:
    branches:
      - agent/next-security-16-2-12

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/next-security-16-2-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Generate focused lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.2.12 eslint-config-next@16.2.12
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "Generate Next.js 16.2.12 lockfile"
          git push
