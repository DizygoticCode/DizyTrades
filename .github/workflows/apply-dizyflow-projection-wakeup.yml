name: Apply DizyFlow projection wakeup patch

on:
  push:
    branches:
      - agent/stabilise-dizyflow-projection-wakeup
    paths:
      - ".github/workflows/apply-dizyflow-projection-wakeup.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilise-dizyflow-projection-wakeup
          fetch-depth: 0

      - name: Apply source and regression-test patch
        run: |
          python - <<'PY'
          from pathlib import Path

          primitive = Path("app/lib/chart/dizyflow-primitive.ts")
          source = primitive.read_text()

          marker = '''type PaneZOrder = "bottom" | "top";\n\n'''
          addition = '''type PaneZOrder = "bottom" | "top";\n\ntype RetainedProjection = Readonly<{\n  candles: readonly Candle[];\n  timeframe: CandleTimeframe;\n  generation: number;\n}>;\n\nconst retainedProjectionByStore = new WeakMap<FlowRenderStore, RetainedProjection>();\n\n'''
          if marker not in source:
              raise SystemExit("projection type insertion marker missing")
          source = source.replace(marker, addition, 1)

          constructor = '''  constructor(private store: FlowRenderStore) {}\n'''
          replacement = '''  constructor(private store: FlowRenderStore) {\n    const retained = retainedProjectionByStore.get(store);\n    if (!retained) return;\n    this.candles = retained.candles;\n    this.timeframe = retained.timeframe;\n    this.projectionGeneration = retained.generation;\n    this.store.updateDiagnostics({ candleCount: retained.candles.length });\n  }\n'''
          if constructor not in source:
              raise SystemExit("primitive constructor marker missing")
          source = source.replace(constructor, replacement, 1)

          projection = '''    this.candles = candles;\n    this.timeframe = timeframe;\n    this.projectionGeneration = generation;\n    this.store.updateDiagnostics({ candleCount: candles.length });\n'''
          projection_replacement = '''    this.candles = candles;\n    this.timeframe = timeframe;\n    this.projectionGeneration = generation;\n    retainedProjectionByStore.set(\n      this.store,\n      Object.freeze({ candles, timeframe, generation }),\n    );\n    this.store.updateDiagnostics({ candleCount: candles.length });\n'''
          if projection not in source:
              raise SystemExit("setProjection assignment marker missing")
          source = source.replace(projection, projection_replacement, 1)
          primitive.write_text(source)

          test = Path("tests/dizyflow-projection-retention.test.mjs")
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\n\nimport { DizyFlowPrimitive } from "../app/lib/chart/dizyflow-primitive.ts";\n\nfunction createStore() {\n  let diagnostics = { candleCount: 0 };\n  return {\n    getDiagnostics: () => diagnostics,\n    updateDiagnostics: (next) => {\n      diagnostics = { ...diagnostics, ...next };\n    },\n  };\n}\n\nconst candles = Object.freeze([\n  Object.freeze({ time: 1_700_000_000, open: 100, high: 102, low: 99, close: 101, volume: 10 }),\n  Object.freeze({ time: 1_700_000_900, open: 101, high: 103, low: 100, close: 102, volume: 12 }),\n]);\n\ntest("a replacement DizyFlow primitive inherits the latest projection from its stable render store", () => {\n  const store = createStore();\n  const first = new DizyFlowPrimitive(store);\n\n  assert.equal(\n    first.setProjection(candles, "15m", 7, {\n      count: candles.length,\n      finalTime: candles.at(-1).time,\n      generation: 7,\n    }),\n    true,\n  );\n  assert.equal(store.getDiagnostics().candleCount, 2);\n\n  store.updateDiagnostics({ candleCount: 0 });\n  new DizyFlowPrimitive(store);\n  assert.equal(store.getDiagnostics().candleCount, 2);\n});\n\ntest("projection retention remains isolated to one render-store lifetime", () => {\n  const firstStore = createStore();\n  const first = new DizyFlowPrimitive(firstStore);\n  first.setProjection(candles, "15m", 3, {\n    count: candles.length,\n    finalTime: candles.at(-1).time,\n    generation: 3,\n  });\n\n  const separateStore = createStore();\n  new DizyFlowPrimitive(separateStore);\n  assert.equal(separateStore.getDiagnostics().candleCount, 0);\n});\n''')

          Path(".github/workflows/apply-dizyflow-projection-wakeup.yml").unlink()
          PY

      - name: Commit the surgical patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retain DizyFlow projection across primitive replacement"
          git push origin HEAD:agent/stabilise-dizyflow-projection-wakeup
