name: DIZY DEX feed resilience proof

on:
  push:
    branches:
      - fix/dizy-dex-feed-resilience

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dizy-dex-feed-resilience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Preserve DEX chart across transient provider misses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/trading-terminal.tsx')
          text=p.read_text()
          old='        setDataSource(dexRequest ? `${payload.source.toUpperCase()} · RAYDIUM` : payload.source.toUpperCase());\n        setResultMarketKey(requestKey);'
          new='        setDataSource(dexRequest ? `${payload.source.toUpperCase()} · RAYDIUM` : payload.source.toUpperCase());\n        setFeedError("");\n        setResultMarketKey(requestKey);'
          if new not in text:
            if text.count(old)!=1: raise SystemExit('success-state anchor changed')
            text=text.replace(old,new,1)
          old='        const dexFailure = selectedDexMarket !== null;\n        setFeedError(\n          error instanceof Error && error.message === "Unsupported DEX timeframe"'
          new='        const dexFailure = selectedDexMarket !== null;\n        if (dexFailure && !blocking) {\n          setRealtimeStatus("delayed");\n          return;\n        }\n        setFeedError(\n          error instanceof Error && error.message === "Unsupported DEX timeframe"'
          if new not in text:
            if text.count(old)!=1: raise SystemExit('DEX failure-state anchor changed')
            text=text.replace(old,new,1)
          old='    const timer = window.setInterval(\n      () => void loadMarketData({ reason: "reconnect", resetView: false }),\n      15_000,\n    );'
          new='    const timer = window.setInterval(\n      () => void loadMarketData({ reason: "reconnect", resetView: false }),\n      65_000,\n    );'
          if new not in text:
            if text.count(old)!=1: raise SystemExit('DEX poll interval anchor changed')
            text=text.replace(old,new,1)
          p.write_text(text)
          PY
      - run: npm ci
      - name: Focused DEX tests
        run: node --conditions=react-server --import tsx --test tests/dex.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Commit verified terminal patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No terminal patch changes to commit."
            exit 0
          fi
          git config user.name "DizyTrades CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/trading-terminal.tsx
          git commit -m "Keep DIZY chart visible across transient DEX feed misses"
          git push origin HEAD:fix/dizy-dex-feed-resilience
