name: Apply PR 147 reduce-only semantics

on:
  push:
    branches:
      - feature/dizypaper-reduce-only-semantics
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: apply-pr147-reduce-only
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-reduce-only-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reduce-only product patch
        run: |
          node scripts/pr147/01-core.mjs
          node scripts/pr147/01a-close-helper-brace.mjs
          node scripts/pr147/02-lifecycles.mjs
          node scripts/pr147/03-boundaries.mjs
          node scripts/pr147/04-tests-roadmap.mjs
      - name: Compact full-suite failure diagnostics
        shell: bash
        run: |
          set +e
          npm test > /tmp/pr147-full.log 2>&1
          status=$?
          echo "===== FAILURE INDEX ====="
          grep -nE "^(not ok|# Subtest:)|NO_POSITION|STALE_REDUCE_ONLY|REDUCE_ONLY|position quantity does not reconcile|AssertionError|tests/.*:[0-9]+:[0-9]+" /tmp/pr147-full.log | tail -n 260 || true
          echo "===== FAILURE TAIL ====="
          tail -n 180 /tmp/pr147-full.log
          exit $status
