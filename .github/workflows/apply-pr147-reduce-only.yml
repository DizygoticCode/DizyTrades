name: Apply PR 147 reduce-only semantics

on:
  push:
    branches:
      - feature/dizypaper-reduce-only-semantics
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: apply-pr147-reduce-only
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-reduce-only-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reduce-only product patch
        run: |
          node scripts/pr147/01-core.mjs
          node scripts/pr147/01a-close-helper-brace.mjs
          node scripts/pr147/02-lifecycles.mjs
          node scripts/pr147/03-boundaries.mjs
          node scripts/pr147/04-tests-roadmap.mjs
      - name: Print failing legacy test bodies
        run: |
          node - <<'NODE'
          const {readFileSync}=require('node:fs');
          const cases=[
            ['tests/manual-paper.test.mjs','Manual Paper opens, partially closes, reverses and liquidates isolated positions'],
            ['tests/manual-paper.test.mjs','cross margin liquidation boundary improves with account collateral'],
            ['tests/manual-paper.test.mjs','manual order execution enforces MEXC contract volume and price steps'],
            ['tests/manual-paper-depth-exits.test.mjs','manual exit depth evidence survives backup and rejects tampering'],
          ];
          for(const [path,title] of cases){
            const s=readFileSync(path,'utf8'),i=s.indexOf(title);
            console.log('\n===== '+title+' @ '+i+' =====');
            console.log(i<0?'NOT FOUND':s.slice(Math.max(0,i-20),i+2600));
          }
          NODE
      - name: Print failing test diagnostics
        run: |
          node --conditions=react-server --import tsx --test --test-name-pattern="Manual Paper opens, partially closes|cross margin liquidation boundary|manual order execution enforces|manual exit depth evidence survives" tests/manual-paper.test.mjs tests/manual-paper-depth-exits.test.mjs || true
