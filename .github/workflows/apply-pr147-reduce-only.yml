name: Apply PR 147 reduce-only semantics

on:
  push:
    branches:
      - feature/dizypaper-reduce-only-semantics
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: apply-pr147-reduce-only
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-reduce-only-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reduce-only product patch
        run: |
          node scripts/pr147/01-core.mjs
          node scripts/pr147/01a-close-helper-brace.mjs
          node scripts/pr147/02-lifecycles.mjs
          node scripts/pr147/03-boundaries.mjs
          node scripts/pr147/04-tests-roadmap.mjs
          node scripts/pr147/05-compat-tests.mjs
      - name: Focused reduce-only and automatic-risk tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-reduce-only.test.mjs tests/manual-paper-depth-auto-risk.test.mjs tests/manual-paper-depth-auto-risk-route.test.mjs tests/manual-paper-depth-exit-route.test.mjs tests/manual-paper-depth-reverse-flatten-route.test.mjs
      - name: Full unit suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove temporary patch machinery
        run: rm -rf scripts/pr147 .github/workflows/apply-pr147-reduce-only.yml
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated product changes were produced."
            exit 1
          fi
          git commit -m "Enforce reduce-only paper exits"
          git push origin HEAD:feature/dizypaper-reduce-only-semantics
