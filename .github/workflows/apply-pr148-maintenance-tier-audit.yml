name: Apply PR 148 maintenance tier audit

on:
  push:
    branches:
      - feature/dizypaper-maintenance-tiers-bankruptcy-audit
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: apply-pr148-maintenance-tier-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-maintenance-tiers-bankruptcy-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply maintenance tier product patch
        run: |
          node scripts/pr148/01-risk-model.mjs
          node scripts/pr148/01a-liquidation-position-basis.mjs
          node scripts/pr148/02-manual-paper.mjs
          node scripts/pr148/02a-integration-fixes.mjs
          node scripts/pr148/03-boundaries.mjs
          node scripts/pr148/03a-backup-position-basis.mjs
          node scripts/pr148/04-tests-roadmap.mjs
          node scripts/pr148/04a-test-contract-fixes.mjs
          node scripts/pr148/04b-position-basis-tests.mjs
      - name: Focused maintenance tier and bankruptcy tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-risk-tiers.test.mjs tests/manual-paper-risk-tier-source.test.mjs tests/manual-paper-engine.test.mjs tests/mexc-contract-metadata.test.mjs tests/manual-paper-reduce-only.test.mjs tests/manual-paper-depth-auto-risk.test.mjs
      - name: Full unit suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Remove temporary patch machinery
        run: rm -rf scripts/pr148 .github/workflows/apply-pr148-maintenance-tier-audit.yml
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated product changes were produced."
            exit 1
          fi
          git commit -m "Audit maintenance tiers and bankruptcy prices"
          git push origin HEAD:feature/dizypaper-maintenance-tiers-bankruptcy-audit
