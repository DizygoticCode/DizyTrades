name: Apply PR 136 review fixes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/dizypaper-contract-precision

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/dizypaper-contract-precision
          fetch-depth: 0
      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply review corrections
        run: node scripts/pr136-review-fixes.mjs
      - name: Run focused DizyPaper tests
        run: node --conditions=react-server --import tsx --test tests/manual-paper-engine.test.mjs tests/manual-paper.test.mjs tests/mexc-contract-metadata.test.mjs tests/user-backup.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Run production build
        run: npm run build
      - name: Remove branch-only machinery
        run: rm -f scripts/pr136-review-fixes.mjs .github/workflows/pr136-review-fixes.yml
      - name: Commit validated review corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden contract precision edge cases"
          git push origin HEAD:feature/dizypaper-contract-precision
