<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>Expectancy variance and drawdown</title><rect width="1200" height="620" rx="28" fill="#090d16"/><text x="70" y="58" fill="#eef2fb" font-family="Arial" font-size="30" font-weight="700">EXPECTANCY · VARIANCE · DRAWDOWN</text><path d="M90 450L150 390L210 430L270 330L330 370L390 300L450 360L510 250L570 290L630 220L690 330L750 275L810 190L870 235L930 150L990 205L1090 120" fill="none" stroke="#2ee6a6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 220V330H810V190" fill="#ff7a8a" opacity=".15" stroke="#ff7a8a" stroke-width="4" stroke-dasharray="10 8"/><text x="750" y="365" text-anchor="middle" fill="#ff7a8a" font-family="Arial" font-size="21" font-weight="700">DRAWDOWN</text><g font-family="Arial" font-weight="700"><rect x="90" y="500" width="300" height="64" rx="16" fill="#102b25" stroke="#2ee6a6" stroke-width="3"/><text x="240" y="540" text-anchor="middle" fill="#2ee6a6" font-size="22">AVG WIN × WIN RATE</text><rect x="450" y="500" width="300" height="64" rx="16" fill="#2a1720" stroke="#ff7a8a" stroke-width="3"/><text x="600" y="540" text-anchor="middle" fill="#ff7a8a" font-size="22">AVG LOSS × LOSS RATE</text><text x="790" y="540" fill="#eef2fb" font-size="28">= EXPECTANCY</text></g><text x="600" y="600" text-anchor="middle" fill="#8996ad" font-family="Arial" font-size="18" font-weight="700">a positive average still includes losing streaks, variance and uncomfortable equity paths</text></svg>