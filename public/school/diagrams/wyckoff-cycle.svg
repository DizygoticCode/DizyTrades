<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Wyckoff market cycle</title><desc id="d">Accumulation, markup, distribution and markdown shown as a cautious market-cycle framework.</desc><rect width="1200" height="520" rx="28" fill="#090d16"/><g stroke="#1d2940" stroke-width="2"><path d="M70 100H1130M70 200H1130M70 300H1130M70 400H1130"/></g><path d="M80 370C150 310 220 420 300 345C390 260 425 145 520 100C605 60 650 150 710 165C795 185 845 90 930 145C1015 200 1010 330 1120 390" fill="none" stroke="#eef2fb" stroke-width="9" stroke-linecap="round"/><rect x="75" y="300" width="270" height="125" rx="16" fill="#2ee6a614" stroke="#2ee6a6" stroke-width="3"/><rect x="690" y="90" width="275" height="125" rx="16" fill="#ffd07114" stroke="#ffd071" stroke-width="3"/><path d="M350 320L535 105" stroke="#57a5ff" stroke-width="6"/><path d="M950 190L1115 390" stroke="#ff5c70" stroke-width="6"/><g font-family="Arial,sans-serif" font-weight="700"><text x="85" y="55" fill="#eef2fb" font-size="28">WYCKOFF CYCLE — A HYPOTHESIS, NOT A FACT</text><text x="120" y="345" fill="#2ee6a6" font-size="26">ACCUMULATION</text><text x="410" y="220" fill="#57a5ff" font-size="26">MARKUP</text><text x="735" y="140" fill="#ffd071" font-size="26">DISTRIBUTION</text><text x="990" y="300" fill="#ff5c70" font-size="26">MARKDOWN</text><text x="105" y="392" fill="#8996ad" font-size="18">range + tests</text><text x="745" y="183" fill="#8996ad" font-size="18">range + supply response</text></g></svg>