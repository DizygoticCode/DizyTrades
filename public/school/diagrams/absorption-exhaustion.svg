<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>Absorption exhaustion and trapped traders</title><rect width="1200" height="620" rx="28" fill="#090d16"/><text x="70" y="58" fill="#eef2fb" font-family="Arial" font-size="30" font-weight="700">ABSORPTION · EXHAUSTION · TRAPPED TRADERS</text><g stroke="#1d2940" stroke-width="2"><path d="M70 130H1130M70 230H1130M70 330H1130M70 430H1130M70 530H1130"/></g><path d="M90 470L190 410L290 430L390 350L490 365L590 290L690 300L790 245L890 250L970 190L1080 210" fill="none" stroke="#eef2fb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 430V250M320 420V215M390 350V190" stroke="#ff7a8a" stroke-width="18" opacity=".8"/><text x="320" y="175" text-anchor="middle" fill="#ff7a8a" font-family="Arial" font-size="21" font-weight="700">HEAVY AGGRESSIVE SELLING</text><path d="M230 445H430" stroke="#2ee6a6" stroke-width="8"/><text x="330" y="485" text-anchor="middle" fill="#2ee6a6" font-family="Arial" font-size="21" font-weight="700">LIMITED PRICE PROGRESS = ABSORPTION</text><g fill="#57a5ff"><circle cx="710" cy="300" r="30"/><circle cx="780" cy="260" r="24"/><circle cx="850" cy="255" r="17"/><circle cx="910" cy="235" r="11"/></g><text x="810" y="355" text-anchor="middle" fill="#57a5ff" font-family="Arial" font-size="21" font-weight="700">DECLINING AGGRESSION = EXHAUSTION</text><path d="M970 190L1040 135L1090 205L1015 245" fill="none" stroke="#ffd071" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="1005" y="110" text-anchor="middle" fill="#ffd071" font-family="Arial" font-size="21" font-weight="700">FAILED BREAKOUT</text><text x="1010" y="285" text-anchor="middle" fill="#ffd071" font-family="Arial" font-size="20" font-weight="700">late buyers trapped</text><text x="600" y="590" text-anchor="middle" fill="#8996ad" font-family="Arial" font-size="18" font-weight="700">effort without result is a hypothesis — wait for structure and follow-through</text></svg>