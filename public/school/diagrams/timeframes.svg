<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Scalping and swing timeframes</title><desc id="d">A comparison of fifteen-minute scalping with one-hour and four-hour swing analysis.</desc><rect width="1200" height="520" rx="28" fill="#090d16"/><g stroke="#1d2940" stroke-width="2"><path d="M70 100H1130M70 200H1130M70 300H1130M70 400H1130"/><path d="M600 65V455"/></g><text x="70" y="55" fill="#eef2fb" font-family="Arial,sans-serif" font-size="29" font-weight="800">TIMEFRAME MODES — DIFFERENT SIGNAL CADENCE</text><g font-family="Arial,sans-serif" font-weight="800"><text x="310" y="105" text-anchor="middle" fill="#2ee6a6" font-size="28">SCALPING · 15m</text><text x="895" y="105" text-anchor="middle" fill="#57a5ff" font-size="28">SWING · 1H / 4H</text></g><path d="M85 320L125 270L165 330L205 245L245 310L285 220L325 300L365 235L405 285L445 205L485 270L535 225" fill="none" stroke="#2ee6a6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M660 350L750 310L830 330L925 225L1015 255L1110 150" fill="none" stroke="#57a5ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif" fill="#aab4c6" font-size="22"><text x="95" y="390">More observations</text><text x="95" y="425">More noise, spread and fee sensitivity</text><text x="665" y="390">Fewer, slower observations</text><text x="665" y="425">Wider invalidation and longer event exposure</text></g><g fill="#090d16" stroke-width="4"><circle cx="205" cy="245" r="16" stroke="#2ee6a6"/><circle cx="365" cy="235" r="16" stroke="#2ee6a6"/><circle cx="925" cy="225" r="16" stroke="#57a5ff"/></g></svg>