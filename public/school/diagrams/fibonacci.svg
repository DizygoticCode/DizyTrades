<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Fibonacci retracement</title><desc id="d">A measured swing with common retracement levels and a hypothetical reaction zone.</desc><rect width="1200" height="520" rx="28" fill="#090d16"/><g stroke="#1d2940" stroke-width="2"><path d="M70 100H1130M70 200H1130M70 300H1130M70 400H1130"/><path d="M220 55V465M460 55V465M700 55V465M940 55V465"/></g><text x="70" y="55" fill="#eef2fb" font-family="Arial,sans-serif" font-size="29" font-weight="800">FIBONACCI — MEASURED RETRACEMENT ZONES</text><path d="M95 405L590 105L885 290L1100 170" fill="none" stroke="#eef2fb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><g stroke="#ff9f43" stroke-width="4"><path d="M95 405H1085"/><path d="M95 333H1085"/><path d="M95 290H1085"/><path d="M95 250H1085"/><path d="M95 205H1085"/><path d="M95 105H1085"/></g><rect x="80" y="238" width="1020" height="64" rx="14" fill="#ff9f4318" stroke="#ff9f43" stroke-width="3"/><g font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#ffbd7a"><text x="1010" y="398">0.000</text><text x="1010" y="326">0.236</text><text x="1010" y="283">0.382</text><text x="1010" y="243">0.500</text><text x="1010" y="198">0.618</text><text x="1010" y="98">1.000</text></g><g font-family="Arial,sans-serif" fill="#aab4c6" font-size="21"><text x="115" y="385">swing low</text><text x="530" y="88">swing high</text><text x="690" y="275">reaction zone, not a prediction</text><text x="820" y="150">confirmation requires price + structure</text></g></svg>