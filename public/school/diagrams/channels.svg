<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Trendlines, manual channels and regression channels</title><desc id="d">A manual rising channel with repeated contained pivot touches, beside a linear regression channel where price oscillates around the best-fit centre line before one breakout and retest.</desc><rect width="1200" height="620" rx="28" fill="#090d16"/><g stroke="#1d2940" stroke-width="2"><path d="M70 120H1130M70 240H1130M70 360H1130M70 480H1130"/><path d="M200 70V550M400 70V550M600 70V550M800 70V550M1000 70V550"/></g><path d="M590 90V545" stroke="#25324a" stroke-width="3"/><g><path d="M70 430L555 210M70 535L555 315" stroke="#9a83ff" stroke-width="8"/><path d="M70 482L555 262" stroke="#57a5ff" stroke-width="4" stroke-dasharray="14 11"/><polyline points="90,500 155,430 220,465 285,365 350,400 420,305 485,338 540,270" fill="none" stroke="#2ee6a6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><g fill="#090d16" stroke="#2ee6a6" stroke-width="5"><circle cx="155" cy="430" r="11"/><circle cx="220" cy="465" r="11"/><circle cx="285" cy="365" r="11"/><circle cx="350" cy="400" r="11"/><circle cx="420" cy="305" r="11"/><circle cx="485" cy="338" r="11"/></g><g font-family="Arial,sans-serif" font-weight="700"><text x="80" y="62" fill="#eef2fb" font-size="30">MANUAL RISING CHANNEL</text><text x="95" y="575" fill="#8996ad" font-size="20">Pivot swings remain between parallel support and resistance boundaries</text><text x="375" y="195" fill="#9a83ff" font-size="20">upper boundary</text><text x="375" y="352" fill="#9a83ff" font-size="20">lower boundary</text></g></g><g><path d="M625 405L1115 205M625 515L1115 315" stroke="#ffd071" stroke-width="7" opacity=".9"/><path d="M625 460L1115 260" stroke="#eef2fb" stroke-width="4" stroke-dasharray="14 11"/><path d="M625 405L1115 205L1115 315L625 515Z" fill="#ffd071" opacity=".07"/><polyline points="645,470 705,415 765,448 825,382 885,410 945,342 1000,370 1050,305 1090,325" fill="none" stroke="#57a5ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M1090 325L1135 245" stroke="#2ee6a6" stroke-width="9" stroke-linecap="round"/><path d="M1135 245L1105 280" stroke="#2ee6a6" stroke-width="5" stroke-dasharray="9 8"/><circle cx="1105" cy="280" r="12" fill="#090d16" stroke="#2ee6a6" stroke-width="5"/><g font-family="Arial,sans-serif" font-weight="700"><text x="650" y="62" fill="#eef2fb" font-size="30">LINEAR REGRESSION CHANNEL</text><text x="730" y="575" fill="#8996ad" font-size="20">Price oscillates inside dispersion bands around the best-fit centre line</text><text x="870" y="178" fill="#ffd071" font-size="20">upper band</text><text x="825" y="286" fill="#eef2fb" font-size="20">best-fit centre</text><text x="875" y="405" fill="#ffd071" font-size="20">lower band</text><text x="1000" y="150" fill="#2ee6a6" font-size="21">single breakout</text><text x="1015" y="235" fill="#2ee6a6" font-size="19">retest</text></g></g></svg>