<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Market, limit and stop orders</title><desc id="d">Three order types compared against a simplified price path and order book.</desc><rect width="1200" height="520" rx="28" fill="#090d16"/><g stroke="#1d2940" stroke-width="2"><path d="M70 100H1130M70 200H1130M70 300H1130M70 400H1130"/><path d="M300 55V465M600 55V465M900 55V465"/></g><g font-family="Arial,sans-serif"><text x="70" y="55" fill="#eef2fb" font-size="29" font-weight="800">ORDER TYPES — EXECUTION TRADE-OFFS</text><text x="175" y="105" text-anchor="middle" fill="#57a5ff" font-size="26" font-weight="800">MARKET</text><text x="510" y="105" text-anchor="middle" fill="#2ee6a6" font-size="26" font-weight="800">LIMIT</text><text x="880" y="105" text-anchor="middle" fill="#ffd071" font-size="26" font-weight="800">STOP</text></g><path d="M85 300L145 270L205 315L265 235" fill="none" stroke="#eef2fb" stroke-width="8" stroke-linecap="round"/><circle cx="205" cy="315" r="18" fill="#57a5ff"/><path d="M390 325H620" stroke="#2ee6a6" stroke-width="8" stroke-linecap="round"/><path d="M420 240L490 270L560 225L630 255" fill="none" stroke="#eef2fb" stroke-width="8" stroke-linecap="round"/><circle cx="490" cy="270" r="18" fill="#2ee6a6"/><path d="M750 320H1015" stroke="#ffd071" stroke-width="8" stroke-dasharray="16 12"/><path d="M740 365L810 340L870 300L930 245L1000 180" fill="none" stroke="#eef2fb" stroke-width="8" stroke-linecap="round"/><circle cx="870" cy="300" r="18" fill="#ffd071"/><g font-family="Arial,sans-serif" fill="#aab4c6" font-size="21"><text x="90" y="385">Immediate execution</text><text x="90" y="420">Price can slip</text><text x="390" y="385">Price control</text><text x="390" y="420">May not fill</text><text x="750" y="385">Activates at trigger</text><text x="750" y="420">Fill can differ from trigger</text></g></svg>