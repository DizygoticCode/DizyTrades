<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Order flow foundations</title><desc id="d">Resting bids and asks, aggressive orders, spread and price movement through the book.</desc><rect width="1200" height="650" rx="28" fill="#090d16"/><g font-family="Arial,sans-serif"><text x="70" y="58" fill="#eef2fb" font-size="30" font-weight="800">ORDER FLOW — THE MARKET BENEATH THE CANDLE</text><rect x="70" y="100" width="430" height="470" rx="22" fill="#0e1522" stroke="#283750" stroke-width="3"/><text x="285" y="140" text-anchor="middle" fill="#eef2fb" font-size="22" font-weight="800">LIMIT ORDER BOOK</text><g font-size="20" font-weight="700"><text x="120" y="182" fill="#8996ad">PRICE</text><text x="250" y="182" fill="#8996ad">BID</text><text x="390" y="182" fill="#8996ad">ASK</text></g><g font-size="19" font-weight="700"><rect x="95" y="205" width="380" height="50" rx="10" fill="#321a25"/><text x="120" y="238" fill="#ff6386">64,104</text><text x="390" y="238" fill="#ff6386">86</text><rect x="95" y="265" width="380" height="50" rx="10" fill="#321a25"/><text x="120" y="298" fill="#ff6386">64,103</text><text x="390" y="298" fill="#ff6386">41</text><rect x="95" y="325" width="380" height="50" rx="10" fill="#151d2b" stroke="#9a83ff"/><text x="120" y="358" fill="#eef2fb">SPREAD</text><text x="390" y="358" fill="#9a83ff">0.1</text><rect x="95" y="385" width="380" height="50" rx="10" fill="#123027"/><text x="120" y="418" fill="#2ee6a6">64,102</text><text x="250" y="418" fill="#2ee6a6">63</text><rect x="95" y="445" width="380" height="50" rx="10" fill="#123027"/><text x="120" y="478" fill="#2ee6a6">64,101</text><text x="250" y="478" fill="#2ee6a6">117</text></g><text x="285" y="540" text-anchor="middle" fill="#8996ad" font-size="18">resting liquidity waits in price queues</text><path d="M545 220H720" stroke="#ff6386" stroke-width="8"/><path d="M700 200L730 220L700 240" fill="none" stroke="#ff6386" stroke-width="8"/><text x="635" y="190" text-anchor="middle" fill="#ff6386" font-size="21" font-weight="800">AGGRESSIVE BUY</text><path d="M720 430H545" stroke="#2ee6a6" stroke-width="8"/><path d="M565 410L535 430L565 450" fill="none" stroke="#2ee6a6" stroke-width="8"/><text x="635" y="475" text-anchor="middle" fill="#2ee6a6" font-size="21" font-weight="800">AGGRESSIVE SELL</text><rect x="745" y="120" width="385" height="430" rx="22" fill="#0e1522" stroke="#283750" stroke-width="3"/><text x="938" y="160" text-anchor="middle" fill="#eef2fb" font-size="22" font-weight="800">WHAT MOVES PRICE?</text><g font-size="20" font-weight="700"><rect x="790" y="205" width="295" height="75" rx="16" fill="#261f38" stroke="#9a83ff"/><text x="938" y="240" text-anchor="middle" fill="#9a83ff">LIQUIDITY CONSUMED</text><text x="938" y="265" text-anchor="middle" fill="#eef2fb" font-size="17">market orders clear a level</text><rect x="790" y="310" width="295" height="75" rx="16" fill="#162639" stroke="#57a5ff"/><text x="938" y="345" text-anchor="middle" fill="#57a5ff">LIQUIDITY WITHDRAWN</text><text x="938" y="370" text-anchor="middle" fill="#eef2fb" font-size="17">resting orders cancel or move</text><rect x="790" y="415" width="295" height="75" rx="16" fill="#133027" stroke="#2ee6a6"/><text x="938" y="450" text-anchor="middle" fill="#2ee6a6">NEXT PRICE LEVEL</text><text x="938" y="475" text-anchor="middle" fill="#eef2fb" font-size="17">trading searches for counterparties</text></g><text x="600" y="620" text-anchor="middle" fill="#8996ad" font-size="19" font-weight="700">candles record the outcome; order flow describes the matching process</text></g></svg>