<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">DizyPaper simulation workflows</title><desc id="d">Manual paper planning compared with confirmed-signal simulation and next-bar entry modelling.</desc><rect width="1200" height="520" rx="28" fill="#090d16"/><g stroke="#1d2940" stroke-width="2"><path d="M70 100H1130M70 200H1130M70 300H1130M70 400H1130"/><path d="M600 65V455"/></g><text x="70" y="55" fill="#eef2fb" font-family="Arial,sans-serif" font-size="29" font-weight="800">DIZYPAPER — TWO SAFE PRACTICE WORKFLOWS</text><g font-family="Arial,sans-serif" font-weight="800"><text x="300" y="105" text-anchor="middle" fill="#2ee6a6" font-size="27">MANUAL PLAN</text><text x="900" y="105" text-anchor="middle" fill="#9a83ff" font-size="27">SIGNAL SIMULATION</text></g><g fill="#101827" stroke-width="3"><rect x="95" y="145" width="410" height="230" rx="20" stroke="#2ee6a6"/><rect x="695" y="145" width="410" height="230" rx="20" stroke="#9a83ff"/></g><g font-family="Arial,sans-serif" font-size="22"><text x="130" y="195" fill="#eef2fb">1. Choose entry</text><text x="130" y="235" fill="#ff6b7d">2. Define invalidation / stop</text><text x="130" y="275" fill="#2ee6a6">3. Set target and risk size</text><text x="130" y="315" fill="#aab4c6">4. Record the reason before outcome</text><text x="730" y="195" fill="#eef2fb">1. Confirm source candle close</text><text x="730" y="235" fill="#9a83ff">2. Apply configured confluence rules</text><text x="730" y="275" fill="#57a5ff">3. Model entry on following bar</text><text x="730" y="315" fill="#aab4c6">4. Review fees, slippage and drawdown</text></g><path d="M520 260H675" stroke="#ffd071" stroke-width="6" stroke-dasharray="14 11"/><path d="M650 240L680 260L650 280" fill="none" stroke="#ffd071" stroke-width="6" stroke-linecap="round"/><text x="600" y="410" text-anchor="middle" fill="#ffd071" font-family="Arial,sans-serif" font-size="22" font-weight="800">PAPER RESULTS ARE MODELS — NOT 