<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Spot order reservations and exact releases</title>
<desc id="desc">Buy and sell limit orders moving quote or base balances between available and reserved amounts through fills, refunds, cancellations and releases.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd071"/></marker>
<style>.t{font-family:Arial,Helvetica,sans-serif}.h{font-size:23px;font-weight:700;fill:#eef2fb}.k{font-size:10px;font-weight:700;letter-spacing:1.1px;fill:#8996ad}.n{font-size:14px;font-weight:700;fill:#eef2fb}.s{font-size:10.5px;fill:#b3bdd0}.line{stroke:#ffd071;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
<rect width="900" height="420" rx="24" fill="#090d16"/>
<text class="t h" x="30" y="38">SPOT ACCOUNTING: AVAILABLE ↔ RESERVED</text>
<text class="t k" x="31" y="57">EVERY RESERVATION, FILL, REFUND AND RELEASE IS AN IMMUTABLE LEDGER EVENT</text>

<g class="t">
  <g transform="translate(30 88)">
    <rect width="400" height="226" rx="16" fill="#111827" stroke="#57a5ff" stroke-width="2"/>
    <text class="k" x="18" y="26" fill="#57a5ff">BUY LIMIT · RESERVE QUOTE</text>
    <g transform="translate(18 43)"><rect width="166" height="52" rx="10" fill="#151f30" stroke="#3c557b"/><text class="n" x="12" y="22">Available quote</text><text class="s" x="12" y="40">10,000 USDT</text></g>
    <g transform="translate(216 43)"><rect width="166" height="52" rx="10" fill="#201a34" stroke="#9a83ff"/><text class="n" x="12" y="22">Reserved quote</text><text class="s" x="12" y="40">0 → qty × limit</text></g>
    <path class="line" d="M184 69H208"/>
    <text class="s" x="18" y="122">Partial fill below limit:</text>
    <text class="s" x="18" y="142">• spend actual execution cost</text>
    <text class="s" x="18" y="160">• refund price improvement immediately</text>
    <text class="s" x="18" y="178">• reserve only remaining qty × original limit</text>
    <rect x="18" y="190" width="364" height="25" rx="12" fill="#112820" stroke="#2ee6a6"/>
    <text class="s" x="200" y="207" text-anchor="middle">Cancel / IOC remainder → exact quote release</text>
  </g>

  <g transform="translate(470 88)">
    <rect width="400" height="226" rx="16" fill="#111827" stroke="#ff7fc8" stroke-width="2"/>
    <text class="k" x="18" y="26" fill="#ff7fc8">SELL LIMIT · RESERVE BASE</text>
    <g transform="translate(18 43)"><rect width="166" height="52" rx="10" fill="#151f30" stroke="#3c557b"/><text class="n" x="12" y="22">Available base</text><text class="s" x="12" y="40">2.00 BTC</text></g>
    <g transform="translate(216 43)"><rect width="166" height="52" rx="10" fill="#2a1c28" stroke="#ff7fc8"/><text class="n" x="12" y="22">Reserved base</text><text class="s" x="12" y="40">0 → remaining qty</text></g>
    <path class="line" d="M184 69H208"/>
    <text class="s" x="18" y="122">Partial fill:</text>
    <text class="s" x="18" y="142">• reduce reserved base by executed quantity</text>
    <text class="s" x="18" y="160">• credit actual quote proceeds</text>
    <text class="s" x="18" y="178">• retain completed fill and fees separately</text>
    <rect x="18" y="190" width="364" height="25" rx="12" fill="#112820" stroke="#2ee6a6"/>
    <text class="s" x="200" y="207" text-anchor="middle">Cancel / IOC remainder → exact base release</text>
  </g>
</g>

<g class="t" transform="translate(30 335)">
  <rect width="840" height="48" rx="12" fill="#151d2b" stroke="#8996ad"/>
  <text class="k" x="16" y="18">REPLACEMENT RECONCILIATION</text>
  <text class="s" x="16" y="36">retain prior fills → release original remainder → create linked replacement → reserve only the replacement requirement</text>
</g>
<text class="t s" x="450" y="407" text-anchor="middle">Released funds are not profit. Simulation balances are not a connected MEXC account balance.</text>
</svg>