<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">DizySignals confluence</title><desc id="d">Trend, structure, pattern and participation evidence combine after candle close before a hypothetical next-bar signal.</desc><rect width="1200" height="520" rx="28" fill="#090d16"/><g font-family="Arial,sans-serif" font-weight="700"><text x="85" y="55" fill="#eef2fb" font-size="28">DIZYSIGNALS — CONFLUENCE, NOT PREDICTION</text></g><g stroke-width="4"><rect x="80" y="115" width="220" height="92" rx="18" fill="#10253a" stroke="#57a5ff"/><rect x="80" y="235" width="220" height="92" rx="18" fill="#102b25" stroke="#2ee6a6"/><rect x="80" y="355" width="220" height="92" rx="18" fill="#2b2137" stroke="#9a83ff"/><rect x="355" y="175" width="220" height="92" rx="18" fill="#352b16" stroke="#ffd071"/></g><g font-family="Arial,sans-serif" font-weight="800" text-anchor="middle"><text x="190" y="153" fill="#57a5ff" font-size="22">TREND</text><text x="190" y="181" fill="#eef2fb" font-size="17">VWAP · MA slope</text><text x="190" y="273" fill="#2ee6a6" font-size="22">STRUCTURE</text><text x="190" y="301" fill="#eef2fb" font-size="17">levels · channels</text><text x="190" y="393" fill="#9a83ff" font-size="22">PATTERN</text><text x="190" y="421" fill="#eef2fb" font-size="17">triangle · breakout</text><text x="465" y="213" fill="#ffd071" font-size="22">PARTICIPATION</text><text x="465" y="241" fill="#eef2fb" font-size="17">volume · flow</text></g><g stroke="#8996ad" stroke-width="5" fill="none"><path d="M300 160L650 250"/><path d="M300 280L650 270"/><path d="M300 400L650 290"/><path d="M575 220L650 250"/></g><rect x="650" y="205" width="220" height="130" rx="22" fill="#151d2b" stroke="#eef2fb" stroke-width="4"/><g font-family="Arial,sans-serif" font-weight="800" text-anchor="middle"><text x="760" y="247" fill="#eef2fb" font-size="22">CANDLE CLOSED</text><text x="760" y="278" fill="#8996ad" font-size="17">independent evidence</text><text x="760" y="305" fill="#8996ad" font-size="17">meets threshold</text></g><path d="M870 270H955" stroke="#2ee6a6" stroke-width="7"/><path d="M940 255L965 270L940 285" fill="none" stroke="#2ee6a6" stroke-width="7"/><rect x="965" y="200" width="160" height="140" rx="22" fill="#102b25" stroke="#2ee6a6" stroke-width="5"/><g font-family="Arial,sans-serif" font-weight="800" text-anchor="middle"><text x="1045" y="245" fill="#2ee6a6" font-size="24">SIGNAL</text><text x="1045" y="278" fill="#eef2fb" font-size="18">next-bar model</text><text x="1045" y="308" fill="#8996ad" font-size="16">not certainty</text></g><text x="380" y="485" fill="#8996ad" font-family="Arial,sans-serif" font-weight="700" font-size="19">correlated indicators are not independent confirmation</text></svg>