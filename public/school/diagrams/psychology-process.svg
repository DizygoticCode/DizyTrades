<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img"><title>Trading psychology as process design</title><rect width="1200" height="620" rx="28" fill="#090d16"/><text x="70" y="58" fill="#eef2fb" font-family="Arial" font-size="30" font-weight="700">PSYCHOLOGY = PROCESS DESIGN</text><g font-family="Arial" font-weight="700" text-anchor="middle"><rect x="70" y="155" width="230" height="120" rx="20" fill="#2a1720" stroke="#ff7a8a" stroke-width="4"/><text x="185" y="205" fill="#ff7a8a" font-size="23">TRIGGER</text><text x="185" y="240" fill="#eef2fb" font-size="18">loss · FOMO · fatigue</text><rect x="350" y="155" width="230" height="120" rx="20" fill="#352b16" stroke="#ffd071" stroke-width="4"/><text x="465" y="205" fill="#ffd071" font-size="23">PAUSE</text><text x="465" y="240" fill="#eef2fb" font-size="18">checklist · time-out</text><rect x="630" y="155" width="230" height="120" rx="20" fill="#10253a" stroke="#57a5ff" stroke-width="4"/><text x="745" y="205" fill="#57a5ff" font-size="23">DECIDE</text><text x="745" y="240" fill="#eef2fb" font-size="18">rules before feelings</text><rect x="910" y="155" width="220" height="120" rx="20" fill="#102b25" stroke="#2ee6a6" stroke-width="4"/><text x="1020" y="205" fill="#2ee6a6" font-size="23">REVIEW</text><text x="1020" y="240" fill="#eef2fb" font-size="18">log behaviour</text></g><g stroke="#8996ad" stroke-width="7" fill="none"><path d="M300 215H350M580 215H630M860 215H910"/></g><rect x="120" y="360" width="960" height="135" rx="24" fill="#151d2b" stroke="#9a83ff" stroke-width="4"/><g font-family="Arial" font-weight="700"><text x="170" y="405" fill="#9a83ff" font-size="22">PRECOMMITMENT TOOLS</text><text x="170" y="445" fill="#eef2fb" font-size="19">• fixed risk cap   • maximum daily loss   • no revenge sizing   • written invalidation</text><text x="170" y="478" fill="#eef2fb" font-size="19">• mandatory break after rule violation   • alerts instead of constant screen watching</text></g><text x="600" y="575" text-anchor="middle" fill="#8996ad" font-family="Arial" font-size="18" font-weight="700">discipline is easier when the environment makes bad decisions harder to execute</text></svg>