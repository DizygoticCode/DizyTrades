services:
  - type: web
    name: dizytrades-test
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    disk:
      name: dizytrades-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/dizytrades
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: DIZYFLOW_LOW_MEMORY_MODE
        value: "true"
      - key: DIZYFLOW_DEPTH_TRANSPORT
        value: rest
      - key: MEXC_DEPTH_POLL_MS
        value: "2000"
      - key: DIZYFLOW_HISTORY_MINUTES
        value: "5"
      - key: DIZYFLOW_HISTORY_SAMPLE_MS
        value: "2000"
      - key: DIZYFLOW_MAX_HISTORY_SAMPLES
        value: "150"
      - key: DIZYFLOW_MAX_LEVELS_PER_SIDE
        value: "100"
      - key: DIZYFLOW_MAX_COLLECTORS
        value: "2"
      - key: DIZYFLOW_COLLECTOR_IDLE_MS
        value: "30000"
      - key: DIZYFLOW_MAX_HEATMAP_RECORDS
        value: "5000"
      - key: ALLOW_TEST_PLAINTEXT_PASSWORDS
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: ROB_NAME
        value: Rob
      - key: ROB_EMAIL
        sync: false
      - key: ROB_PASSWORD_HASH
        sync: false
      - key: ROB_PASSWORD
        sync: false
      - key: FRIEND_NAME
        value: Friend
      - key: FRIEND_EMAIL
        sync: false
      - key: FRIEND_PASSWORD_HASH
        sync: false
      - key: FRIEND_PASSWORD
        sync: false
