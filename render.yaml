services:
  - type: web
    name: dizytrades-test
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    disk:
      name: dizytrades-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/dizytrades
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: PUBLIC_SIGNUP_ENABLED
        value: "true"
      - key: LEGACY_AUTH_FALLBACK_ENABLED
        value: "true"
      - key: DIZYFLOW_LOW_MEMORY_MODE
        value: "true"
      - key: DIZYFLOW_DEPTH_TRANSPORT
        value: rest
      - key: MEXC_DEPTH_POLL_MS
        value: "2000"
      - key: DIZYFLOW_HISTORY_MINUTES
        value: "5"
      - key: DIZYFLOW_HISTORY_SAMPLE_MS
        value: "2000"
      - key: DIZYFLOW_MAX_HISTORY_SAMPLES
        value: "60"
      - key: DIZYFLOW_MAX_LEVELS_PER_SIDE
        value: "100"
      - key: DIZYFLOW_MAX_COLLECTORS
        value: "2"
      - key: DIZYFLOW_COLLECTOR_IDLE_MS
        value: "30000"
      - key: DIZYFLOW_MAX_HEATMAP_RECORDS
        value: "20000"
      - key: DIZYFLOW_HEATMAP_RETENTION_MINUTES
        value: "360"
      - key: DIZYFLOW_HEATMAP_SAMPLE_MS
        value: "5000"
      - key: DIZYFLOW_HEATMAP_MAX_MEMORY_RECORDS
        value: "10000"
      - key: DIZYFLOW_HEATMAP_MAX_DISK_MB
        value: "64"
      - key: DIZYFLOW_ARCHIVE_SYMBOLS
        value: BTC_USDT
      - key: DIZYFLOW_MAX_TAPES
        value: "2"
      - key: DIZYFLOW_HEATMAP_TOTAL_DISK_MB
        value: "512"
      - key: DIZYFLOW_MEMORY_WARN_MB
        value: "300"
      - key: DIZYFLOW_MEMORY_SHED_MB
        value: "340"
      - key: DIZYFLOW_MEMORY_HARD_MB
        value: "380"
      - key: NODE_OPTIONS
        value: --max-old-space-size=300
      - key: ALLOW_TEST_PLAINTEXT_PASSWORDS
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: ROB_NAME
        value: Rob
      - key: ROB_EMAIL
        sync: false
      - key: ROB_PASSWORD_HASH
        sync: false
      - key: ROB_PASSWORD
        sync: false
      - key: FRIEND_NAME
        value: Nick
      - key: FRIEND_EMAIL
        sync: false
      - key: FRIEND_PASSWORD_HASH
        sync: false
      - key: FRIEND_PASSWORD
        sync: false
